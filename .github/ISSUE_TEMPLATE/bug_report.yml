name: 🐞 Bug report
description: Something in Cordless isn't working the way it should.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please search [existing issues](../issues) first to avoid duplicates.
  - type: markdown
    attributes:
      value: |
        ⚠️ **Known issue - Xiaomi, Redmi and POCO phones can't pair.** If you start pairing from your computer and then your **phone** shows **"Incorrect PIN or passkey"** (while the computer looks like it paired), this is a bug in the phone's own Bluetooth software - not in Cordless - and no app can fix it. It affects Xiaomi, Redmi and POCO (same MIUI/HyperOS software). Please don't open a new report for this on those phones. If you see it on a phone from a **different** manufacturer, we'd love to know - continue below.
  - type: checkboxes
    id: known-issue
    attributes:
      label: Known-issue check
      options:
        - label: My phone is NOT a Xiaomi, Redmi or POCO, OR my bug is not the "Incorrect PIN or passkey" pairing failure described above.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug clearly. What did you see?
      placeholder: When I connect to my PC and open the touchpad, Cordless...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: The pointer should have...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we make the bug happen?
      placeholder: |
        1. Open Cordless
        2. Connect to ...
        3. See error
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone model
      placeholder: e.g. Samsung Galaxy S25+, Google Pixel 8
    validations:
      required: true
  - type: input
    id: android-version
    attributes:
      label: Android version
      placeholder: e.g. Android 15
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host device you're controlling
      description: The device Cordless connects to, and its OS.
      placeholder: e.g. Windows 11 PC, Android TV box
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Cordless version
      description: Find it in the app's settings, or on the Google Play listing.
      placeholder: e.g. 1.0
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recording (optional)
      description: Drag and drop images or a short video here if it helps show the problem.
    validations:
      required: false
